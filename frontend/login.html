<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | SVS-BAS Vehicle Service & Breakdown</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Theme CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-dark d-flex align-items-center justify-content-center min-vh-100 py-4">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-7 col-xl-6">
        
        <!-- Brand Header -->
        <div class="text-center mb-4">
          <a href="index.html" class="d-inline-flex align-items-center gap-2 text-white text-decoration-none h4 fw-bold mb-1">
            <i class="fas fa-car-burst text-info"></i>
            <span>SVS-BAS</span>
            <span class="badge-pro">Enterprise</span>
          </a>
          <p class="text-light opacity-75 small">Smart Vehicle Service and Breakdown Assistance System</p>
        </div>

        <!-- Login Card -->
        <div class="card card-custom p-4 p-sm-5 border-0 shadow-lg">
          <div class="mb-4 text-center">
            <h4 class="fw-bold text-dark mb-1">Welcome Back</h4>
            <p class="text-secondary small mb-0">Sign in with your email and password to access your portal</p>
          </div>

          <!-- 1-Click Demo Logins for Project Evaluation -->
          <div class="bg-light p-3 rounded mb-4 border">
            <small class="fw-bold text-dark d-block mb-2 text-uppercase" style="font-size: 0.72rem; letter-spacing: 0.5px;">
              <i class="fas fa-key text-primary me-1"></i>Quick Demo Role Fill (1-Click Test):
            </small>
            <div class="d-flex flex-wrap gap-2">
              <button type="button" class="btn btn-sm btn-outline-primary" onclick="quickFill('customer@demo.com', 'password123')">
                <i class="fas fa-user me-1"></i>Customer
              </button>
              <button type="button" class="btn btn-sm btn-outline-warning text-dark" onclick="quickFill('mechanic@demo.com', 'password123')">
                <i class="fas fa-wrench me-1"></i>Mechanic
              </button>
              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="quickFill('admin@demo.com', 'password123')">
                <i class="fas fa-shield-alt me-1"></i>Admin
              </button>
            </div>
          </div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="loginEmail" class="form-label-custom">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="far fa-envelope text-muted"></i></span>
                <input type="email" class="form-control form-control-custom border-start-0" id="loginEmail" placeholder="name@domain.com" required>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center">
                <label for="loginPassword" class="form-label-custom mb-0">Password</label>
                <a href="#" class="small text-primary text-decoration-none" onclick="alert('Password reset link has been dispatched to your email.'); return false;">Forgot?</a>
              </div>
              <div class="input-group mt-1">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" class="form-control form-control-custom border-start-0" id="loginPassword" placeholder="••••••••" required>
              </div>
            </div>

            <div class="d-flex align-items-center justify-content-between mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label small text-secondary" for="rememberMe">Remember my session</label>
              </div>
            </div>

            <button type="submit" class="btn btn-brand-primary w-100 py-2 mb-3">
              <i class="fas fa-sign-in-alt me-2"></i>Sign In
            </button>

            <div class="text-center small text-secondary">
              Don't have a customer account? <a href="register.html" class="text-primary fw-semibold">Register Vehicle</a>
            </div>
          </form>
        </div>

        <div class="text-center mt-3">
          <a href="index.html" class="text-light opacity-50 small text-decoration-none">
            <i class="fas fa-arrow-left me-1"></i> Back to Homepage
          </a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js?v=20260904_2"></script>
  <script src="js/auth.js?v=20260904_2"></script>
  <script>
    function quickFill(email, password) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = password;
      Toast.info(`Filled credentials for ${email}`);
    }
  </script>
</body>
</html>
