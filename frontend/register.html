<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration | SVS-BAS</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Theme CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-dark d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-7 col-xl-6">
        
        <!-- Brand Header -->
        <div class="text-center mb-4">
          <a href="index.html" class="d-inline-flex align-items-center gap-2 text-white text-decoration-none h4 fw-bold mb-1">
            <i class="fas fa-car-burst text-info"></i>
            <span>SVS-BAS</span>
            <span class="badge-pro">Enterprise</span>
          </a>
          <p class="text-light opacity-75 small">Smart Vehicle Service and Breakdown Assistance System</p>
        </div>

        <!-- Register Card -->
        <div class="card card-custom p-4 p-sm-5 border-0 shadow-lg">
          <div class="mb-4 text-center">
            <h4 class="fw-bold text-dark mb-1">Create Customer Account</h4>
            <p class="text-secondary small mb-0">Register to manage your vehicles, book workshop slots, and unlock 1-tap roadside SOS</p>
          </div>

          <form id="registerForm">
            <input type="hidden" id="regRole" value="ROLE_CUSTOMER">

            <div class="mb-3">
              <label for="regFullName" class="form-label-custom">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="far fa-user text-muted"></i></span>
                <input type="text" class="form-control form-control-custom border-start-0" id="regFullName" placeholder="e.g. Rahul Sharma" required>
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-sm-6">
                <label for="regEmail" class="form-label-custom">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="far fa-envelope text-muted"></i></span>
                  <input type="email" class="form-control form-control-custom border-start-0" id="regEmail" placeholder="rahul@example.com" required>
                </div>
              </div>
              <div class="col-sm-6">
                <label for="regPhone" class="form-label-custom">Mobile Number</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="fas fa-phone text-muted"></i></span>
                  <input type="tel" class="form-control form-control-custom border-start-0" id="regPhone" placeholder="+91 98765 43210" required>
                </div>
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-sm-6">
                <label for="regPassword" class="form-label-custom">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                  <input type="password" class="form-control form-control-custom border-start-0" id="regPassword" placeholder="Min. 8 characters" required minlength="6">
                </div>
              </div>
              <div class="col-sm-6">
                <label for="regConfirmPassword" class="form-label-custom">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="fas fa-check-double text-muted"></i></span>
                  <input type="password" class="form-control form-control-custom border-start-0" id="regConfirmPassword" placeholder="Repeat password" required minlength="6">
                </div>
              </div>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
              <label class="form-check-label small text-secondary" for="termsCheck">
                I agree to the <a href="#" class="text-primary" onclick="alert('Terms of Service: Emergency assistance coordinates and vehicle maintenance logs are secured in accordance with data privacy guidelines.'); return false;">Terms of Service</a> and Privacy Policy.
              </label>
            </div>

            <button type="submit" class="btn btn-brand-primary w-100 py-2 mb-3">
              <i class="fas fa-user-plus me-2"></i>Create Customer Account
            </button>

            <div class="text-center small text-secondary">
              Already have an account? <a href="login.html" class="text-primary fw-semibold">Sign In</a>
            </div>
          </form>
        </div>

        <div class="text-center mt-3">
          <a href="index.html" class="text-light opacity-50 small text-decoration-none">
            <i class="fas fa-arrow-left me-1"></i> Back to Homepage
          </a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
