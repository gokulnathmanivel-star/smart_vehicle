<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assigned Jobs Queue | SVS-BAS Mechanic</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="app-layout">
    
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-brand">
        <i class="fas fa-car-burst text-warning"></i>
        <span>SVS-BAS</span>
        <span class="badge bg-warning text-dark ms-1 text-uppercase" style="font-size:0.65rem;">Tech</span>
      </div>

      <ul class="sidebar-nav">
        <li class="sidebar-section-title">Field Operations</li>
        <li class="sidebar-item">
          <a href="dashboard.html" class="sidebar-link">
            <i class="fas fa-gauge"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="sidebar-item">
          <a href="assigned-jobs.html" class="sidebar-link active">
            <i class="fas fa-clipboard-list"></i>
            <span>Assigned Jobs</span>
          </a>
        </li>
        <li class="sidebar-item">
          <a href="update-job.html" class="sidebar-link">
            <i class="fas fa-wrench"></i>
            <span>Update Work Log</span>
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <div class="user-mini-card">
          <div class="user-avatar bg-warning text-dark fw-bold">V</div>
          <div class="user-details">
            <div class="name">Vikram Singh</div>
            <div class="role-badge">Lead Field Tech</div>
          </div>
          <button class="btn btn-sm btn-outline-light ms-auto btn-logout" title="Sign Out">
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="app-main">
      <header class="app-topbar">
        <div class="d-flex align-items-center gap-3">
          <button type="button" class="sidebar-toggler-btn" id="sidebarToggler">
            <i class="fas fa-bars"></i>
          </button>
          <h5 class="mb-0 fw-bold text-dark">My Assigned Work Orders</h5>
        </div>

        <div class="topbar-actions">
          <span class="badge bg-primary text-white p-2" id="assignedJobsBadge">2 Active Orders</span>
        </div>
      </header>

      <div class="app-content">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h4 class="fw-bold mb-1">Field & Workshop Queue</h4>
            <p class="text-secondary small mb-0">Select any ticket to update progression status, log labor hours, and add replacement parts</p>
          </div>
        </div>

        <!-- Jobs Grid Container -->
        <div class="row g-4" id="mechanicJobsList">
          <!-- Dynamically populated via mechanic.js -->
        </div>

      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js?v=20260903"></script>
  <script src="../js/auth.js?v=20260903"></script>
  <script src="../js/mechanic.js?v=20260903"></script>

</html>
